plugins {
  alias(libs.plugins.kotlinJvm)
  id 'java-gradle-plugin'
  alias(libs.plugins.spotless)
  alias(libs.plugins.publish)
  alias(libs.plugins.dokka)
}

repositories {
  mavenCentral()
  gradlePluginPortal()
}

spotless {
  kotlin {
    target "**/*.kt"
    targetExclude "**/build/grammar/**/*.*", "**/generated/**/*.*", "src/test/fixtures/**/build/grammars/**/*.*"
    ktfmt(libs.ktfmt.get().version).googleStyle()
    trimTrailingWhitespace()
    endWithNewline()
  }
}

gradlePlugin {
  plugins {
    grammarKitComposer {
      id = 'app.cash.grammarkit-composer'
      implementationClass = 'com.alecstrong.grammar.kit.composer.GrammarKitComposerPlugin'
    }
  }
}

dependencies {
  implementation libs.kotlinPoet
  implementation libs.grammarKitPlugin

  testImplementation gradleTestKit()
  testImplementation "org.jetbrains.kotlin:kotlin-test"
}

kotlin.jvmToolchain(17)

publishing {
  repositories {
    maven {
      name = "installLocally"
      url = "${rootProject.buildDir}/localMaven"
    }
  }
}
