[versions]
# Same IntelliJ build as sql-psi and sqldelight (see https://plugins.jetbrains.com/docs/intellij/android-studio-releases-list.html)
intelliJ = "233.14808.21" # Jellyfish | 2023.3.1

[libraries]
kotlinPoet = { module = "com.squareup:kotlinpoet", version = "2.4.0" }
intellijPlatformPlugin = { module = "org.jetbrains.intellij.platform:intellij-platform-gradle-plugin", version = "2.19.0" }
intelliJ = { module = "com.jetbrains.intellij.platform:analysis-impl", version.ref = "intelliJ" }
coroutines = "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
ktfmt = "com.facebook:ktfmt:0.64"

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version = "2.4.20" }
spotless = { id = "com.diffplug.spotless", version = "8.10.2" }
publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
dokka = { id = "org.jetbrains.dokka", version = "2.2.0" }
